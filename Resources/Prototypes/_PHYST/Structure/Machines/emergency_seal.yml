- type: entity
  id: EmergencySealProjector
  parent: BaseItem
  name: emergency seal projector
  description: Deploys a temporary airtight membrane over hull breaches.
  components:
  - type: Sprite
    sprite: Objects/Misc/inflatable_wall.rsi   # verified existing RSI
    state: item_wall
  - type: EmergencySeal
  - type: Airtight
    airBlocked: false
    noAirWhenFullyAirBlocked: false
  - type: Battery
    maxCharge: 1200
    startingCharge: 1200
  - type: Anchorable
  - type: Physics

- type: entity
  id: EmergencySealMembrane
  parent: BaseFoamedMetal          # verified: airtight, anchored, foam-smoothed
  name: seal membrane
  description: A rapidly-cured containment film. It won't hold forever.
  components:
  - type: Sprite
    sprite: Effects/foam.rsi       # verified existing RSI
    layers:
    - state: iron_foam
      map: [ "enum.FoamVisualLayers.Base" ]
